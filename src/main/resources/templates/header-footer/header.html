<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header class="header" th:fragment="header">

    <link rel="stylesheet" th:href="@{/theme-toggle.css}">

    <div class="logo">
        <a th:href="@{/}">
            <img th:src="@{/logo.png}" alt="Acebook Logo">
        </a>
    </div>

    <nav class="navigation">
        <ul class="nav-list">

            <li class="nav-item greeting" sec:authorize="isAuthenticated()">
                Hi, <span th:text="${#authentication.principal.fullName}">User</span>
            </li>

            <li class="nav-item">
                <a th:href="@{/}">Home</a>
            </li>

            <li class="nav-item" sec:authorize="isAnonymous()">
                <a th:href="@{/about}">About</a>
            </li>

            <li class="nav-item" sec:authorize="isAnonymous()">
                <a th:href="@{/features}">Features</a>
            </li>

            <li class="nav-item" sec:authorize="isAnonymous()">
                <a th:href="@{/explore}">Explore</a>
            </li>

            <li class="nav-item" sec:authorize="isAnonymous()">
                <a th:href="@{/oauth2/authorization/auth0}">Sign Up / Log In</a>
            </li>


            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a th:href="@{/profile}">Profile</a>
            </li>

            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a th:href="@{/posts}">Posts</a>
            </li>

            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a th:href="@{/friends}">Friends</a>
            </li>

            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a th:href="@{/search}">Search</a>
            </li>


            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logout-button">Log Out</button>
                </form>
            </li>

            <li class="nav-item">
                <span id="theme-toggle-container"></span>
            </li>

        </ul>
    </nav>

    <script th:src="@{/js/theme-toggle.js}"></script>

</header>

</html>
