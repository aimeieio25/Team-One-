<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="icon" type="image/png" th:href="@{/logo.png}">
    <link rel="stylesheet" href="/main.css">
</head>

<body class="app-nav-body">

    <div th:replace="~{header-footer/header :: header}"></div>

    <main class="profile">

        <header class="profile-heading">
            <h1>Profile settings</h1>
            <p>Manage how you appear across Acebook.</p>
        </header>

        <div class="profile-picture-section">
            <div class="profile-avatar-preview" th:if="${user.profilePicture != null}">
                <img th:src="@{'/uploads/profile-pictures/' + ${user.profilePicture}}" alt="Profile Picture"
                    class="profile-picture">
            </div>

            <div class="profile-avatar-preview profile-avatar-fallback"
                 th:unless="${user.profilePicture != null}" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
                </svg>
            </div>

            <form class="profile-photo-form" th:action="@{/profile/upload-picture}"
                  method="post" enctype="multipart/form-data">
                <div>
                    <h2>Profile picture</h2>
                    <p>Upload a PNG, JPEG, or WebP image.</p>
                </div>
                <input id="profilePicture" type="file" name="profilePicture"
                       accept="image/png,image/jpeg,image/webp" required>
                <button type="submit">Upload new picture</button>
            </form>
        </div>

        <p class="profile-alert profile-alert-error" th:if="${param.handleTaken}">
            That handle is already taken.
        </p>

        <p class="profile-alert profile-alert-success" th:if="${param.updated}">
            Profile updated successfully!
        </p>

        <form class="profile-details-form" th:action="@{/profile}" method="post">

            <div class="profile-form-heading">
                <h2>Personal information</h2>
                <p>Update your public name and unique handle.</p>
            </div>

            <div class="form-field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" name="fullName"
                       th:value="${user.fullName}" autocomplete="name" required>
            </div>

            <div class="form-field">
                <label for="handle">Handle</label>
                <div class="handle-input">
                    <span aria-hidden="true">@</span>
                    <input type="text" id="handle" name="handle"
                           th:value="${user.handle}" autocomplete="username" required>
                </div>
            </div>

            <div class="form-field">
                <span class="field-label">Email</span>
                <div class="readonly-field" th:text="${user.username}"></div>
                <small>Your login email is managed by your account provider.</small>
            </div>

            <div class="profile-form-actions">
                <button type="submit">Save changes</button>
            </div>

        </form>

    </main>

    <div th:replace="~{header-footer/footer :: footer}"></div>

</body>

</html>
