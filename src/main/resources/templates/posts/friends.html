<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Friends</title>
  <link rel="stylesheet" href="/main.css" />
</head>

<body>

<div th:replace="~{header-footer/header :: header}">
</div>

<h1>Friends</h1>

<div th:each="friend : ${friends}">
  <p th:text="${friend.username}"></p>
</div>

<h2>Add a Friend</h2>

<form action="/friend-requests" method="post">
  <input
          type="email"
          name="receiverEmail"
          placeholder="Enter user's email"
          required
  >

  <button type="submit">Send Friend Request</button>
</form>

</body>

</html>
